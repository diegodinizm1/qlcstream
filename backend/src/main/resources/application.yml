spring:
  application:
    name: qlc-stream-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/qlc_stream}
    username: ${DB_USER:qlc_stream}
    password: ${DB_PASSWORD:qlc_stream_local}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

qlc-stream:
  integrations:
    key-file: ${INTEGRATION_SETTINGS_KEY_FILE:}
  tmdb:
    base-url: https://api.themoviedb.org/3
    api-token: ${TMDB_API_TOKEN:}
    cache:
      max-entries: ${TMDB_CACHE_MAX_ENTRIES:300}
      catalog-ttl: ${TMDB_CACHE_CATALOG_TTL:10m}
      search-ttl: ${TMDB_CACHE_SEARCH_TTL:3m}
  prowlarr:
    base-url: ${PROWLARR_BASE_URL:}
    api-key: ${PROWLARR_API_KEY:}
  qbittorrent:
    base-url: ${QBITTORRENT_BASE_URL:}
    username: ${QBITTORRENT_USERNAME:}
    password: ${QBITTORRENT_PASSWORD:}
  storage:
    media-root: ${MEDIA_ROOT:/data}
