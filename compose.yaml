name: qlc-stream

services:
  database:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-qlc_stream}
      POSTGRES_USER: ${POSTGRES_USER:-qlc_stream}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qlc_stream_local}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      DB_URL: jdbc:postgresql://database:5432/${POSTGRES_DB:-qlc_stream}
      DB_USER: ${POSTGRES_USER:-qlc_stream}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-qlc_stream_local}
      TMDB_API_TOKEN: ${TMDB_API_TOKEN:-}
      PROWLARR_BASE_URL: ${PROWLARR_BASE_URL:-}
      PROWLARR_API_KEY: ${PROWLARR_API_KEY:-}
      QBITTORRENT_BASE_URL: ${QBITTORRENT_BASE_URL:-}
      QBITTORRENT_USERNAME: ${QBITTORRENT_USERNAME:-}
      QBITTORRENT_PASSWORD: ${QBITTORRENT_PASSWORD:-}
      MEDIA_ROOT: /data
    volumes:
      - ${MEDIA_HOST_PATH:-./data/media}:/data
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "127.0.0.1:4200:80"
    depends_on:
      - backend
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    environment:
      PUID: 1000
      PGID: 1000
      TZ: America/Fortaleza
    volumes:
      - ./data/prowlarr:/config
    ports:
      - "127.0.0.1:9696:9696"
    restart: unless-stopped

  qbittorrent:
    image: qbittorrentofficial/qbittorrent-nox:latest
    environment:
      QBT_LEGAL_NOTICE: confirm
      QBT_VERSION: 5.1.4
      QBT_WEBUI_PORT: 8080
      QBT_TORRENTING_PORT: 6881
    volumes:
      - ./data/qbittorrent-official:/config
      - ${MEDIA_HOST_PATH:-./data/media}:/downloads
    ports:
      - "127.0.0.1:8081:8080"
      - "6881:6881"
      - "6881:6881/udp"
    restart: unless-stopped

volumes:
  postgres_data:
