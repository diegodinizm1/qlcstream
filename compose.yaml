name: qlc-stream

services:
  database:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-qlc_stream}
      POSTGRES_USER: ${POSTGRES_USER:-qlc_stream}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qlc_stream_local}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      DB_URL: jdbc:postgresql://database:5432/${POSTGRES_DB:-qlc_stream}
      DB_USER: ${POSTGRES_USER:-qlc_stream}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-qlc_stream_local}
      TMDB_API_TOKEN: ${TMDB_API_TOKEN:-}
      MEDIA_ROOT: /data
    volumes:
      - ${MEDIA_HOST_PATH:-./data/media}:/data
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "127.0.0.1:4200:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
