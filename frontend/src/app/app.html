<div class="app-shell" [attr.data-theme]="theme()">
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" routerLink="/catalog" aria-label="QLC Stream">
        <img class="brand-mark" src="qlc-mark.svg" alt="" />
        <span class="brand-name">QLC</span><span class="brand-suffix">stream</span>
      </a>

      <nav aria-label="Navegação principal">
        <a routerLink="/catalog" routerLinkActive="active">Filmes</a>
        <a routerLink="/downloads" routerLinkActive="active">Downloads</a>
        <a routerLink="/library" routerLinkActive="active">Biblioteca</a>
      </nav>

      <form class="global-search" role="search" (submit)="searchCatalog($event)">
        <i class="ph ph-magnifying-glass" aria-hidden="true"></i>
        <label class="sr-only" for="global-catalog-search">Buscar filmes</label>
        <input id="global-catalog-search" type="search" autocomplete="off" placeholder="Buscar no catálogo" [value]="globalQuery()" (input)="updateGlobalQuery($event)" (focus)="openAutocomplete()" (blur)="closeAutocomplete()" />
        @if (autocompleteOpen() && suggestions().length) {
          <div class="autocomplete-list" role="listbox" aria-label="Filmes encontrados">
            @for (movie of suggestions(); track movie.tmdbId) {
              <button type="button" role="option" (mousedown)="$event.preventDefault()" (click)="selectSuggestion(movie)">
                @if (movie.posterPath) { <img [src]="'https://image.tmdb.org/t/p/w92' + movie.posterPath" [alt]="''" /> } @else { <i class="ph ph-film-strip" aria-hidden="true"></i> }
                <span><strong>{{ movie.title }}</strong><small>{{ movie.releaseDate?.slice(0, 4) || 'Sem data' }}</small></span>
              </button>
            }
          </div>
        }
      </form>

      <div class="topbar-actions">
        <button class="theme-toggle" type="button" (click)="toggleTheme()" [attr.aria-label]="theme() === 'dark' ? 'Usar tema claro' : 'Usar tema escuro'">
          <i [class]="theme() === 'dark' ? 'ph ph-sun' : 'ph ph-moon'" aria-hidden="true"></i>
        </button>
        <a class="settings-link" routerLink="/settings" routerLinkActive="active" aria-label="Configurações"><i class="ph ph-gear-six" aria-hidden="true"></i></a>
      </div>
    </div>
  </header>

  <main><router-outlet /></main>

  <nav class="mobile-nav" aria-label="Navegação móvel">
    <a routerLink="/catalog" routerLinkActive="active"><i class="ph ph-film-slate"></i><span>Filmes</span></a>
    <a routerLink="/downloads" routerLinkActive="active"><i class="ph ph-download-simple"></i><span>Downloads</span></a>
    <a routerLink="/library" routerLinkActive="active"><i class="ph ph-books"></i><span>Biblioteca</span></a>
    <a routerLink="/settings" routerLinkActive="active"><i class="ph ph-gear-six"></i><span>Ajustes</span></a>
  </nav>
</div>
