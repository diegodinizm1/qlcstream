<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Conectar qBittorrent · QLC Stream</title>
  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background:#0d1518; color:#edf2f1; }
    body { min-height:100vh; margin:0; display:grid; place-items:center; padding:24px; box-sizing:border-box; }
    main { width:min(100%,420px); padding:32px; border:1px solid #2b3a3f; border-radius:10px; background:#172227; }
    .eyebrow { margin:0 0 14px; color:#42c99a; font:700 11px ui-monospace,monospace; letter-spacing:.08em; text-transform:uppercase; }
    h1 { margin:0; font-size:30px; letter-spacing:-.04em; } p { color:#aab7b9; line-height:1.55; font-size:14px; }
    label { display:grid; gap:7px; margin-top:18px; color:#aab7b9; font-size:12px; font-weight:700; }
    input { height:42px; padding:0 12px; border:1px solid #2b3a3f; border-radius:6px; outline:0; color:#edf2f1; background:#0d1518; font:inherit; }
    input:focus { border-color:#42c99a; box-shadow:0 0 0 3px rgba(66,201,154,.15); }
    button { width:100%; height:42px; margin-top:24px; border:0; border-radius:6px; color:#06251f; background:#42c99a; font-weight:800; cursor:pointer; }
    .error { min-height:20px; margin:14px 0 0; color:#ef776f; font-size:12px; } .back { color:#aab7b9; font-size:12px; text-decoration:none; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Configuração local</p><h1>Conectar qBittorrent</h1>
    <p>Use <strong>admin</strong> e a senha temporária exibida nos logs do contêiner. Depois da conexão, defina uma senha própria na WebUI.</p>
    <form id="login"><label>Usuário<input name="username" value="admin" autocomplete="username" required></label><label>Senha temporária<input name="password" type="password" autocomplete="current-password" required autofocus></label><button>Entrar no qBittorrent</button><p id="error" class="error" aria-live="polite"></p></form>
    <a class="back" href="/settings">Voltar às configurações</a>
  </main>
  <script>
    document.querySelector('#login').addEventListener('submit', async (event) => {
      event.preventDefault(); const form = new FormData(event.currentTarget); const error = document.querySelector('#error'); error.textContent = '';
      const response = await fetch('/qbit-auth/api/v2/auth/login', { method:'POST', body:new URLSearchParams(form), credentials:'include' });
      if (!response.ok) { error.textContent = 'Não foi possível autenticar. Confira a senha temporária nos logs do contêiner.'; return; }
      window.location.assign('/qbit-auth/');
    });
  </script>
</body>
</html>
