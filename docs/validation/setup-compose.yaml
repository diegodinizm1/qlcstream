name: qlcstream-setup-test
services:
  database:
    image: postgres:18.6-alpine@sha256:9ba53c7d41ea093baf5c1ba635ba5434c4f979880527d49bb7d9237d3193085b
    environment:
      POSTGRES_DB: setup_test
      POSTGRES_USER: setup_test
      POSTGRES_PASSWORD: fictional_database_password
    volumes: [database:/var/lib/postgresql]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U setup_test -d setup_test]
      interval: 2s
      timeout: 2s
      retries: 30
  fixture:
    image: postgres:18.6-alpine@sha256:9ba53c7d41ea093baf5c1ba635ba5434c4f979880527d49bb7d9237d3193085b
    user: root
    entrypoint: /bin/sh
    command: [/prepare-directories.sh]
    volumes: [keys:/secrets, media:/media, ../../backend/docker/prepare-directories.sh:/prepare-directories.sh:ro]
  mock:
    image: python:3.13-alpine@sha256:9ef1a599f863231c3d91e941389bfdc4a2d6070557243d54df1a4e57015b960e
    command: [python, /fixture/mock-integrations.py]
    volumes: [./mock-integrations.py:/fixture/mock-integrations.py:ro]
  backend:
    group_add: ["1000"]
    build: ../../backend
    networks: [default, preview]
    environment:
      DB_URL: jdbc:postgresql://database:5432/setup_test
      DB_USER: setup_test
      DB_PASSWORD: fictional_database_password
      INTEGRATION_SETTINGS_KEY_FILE: /run/qlcstream-secrets/integration-settings.key
      QLC_STREAM_TMDB_BASE_URL: http://mock:8000
      MEDIA_ROOT: /data
    volumes: [keys:/run/qlcstream-secrets, media:/data]
    ports: [127.0.0.1:18088:8080]
    depends_on:
      fixture:
        condition: service_completed_successfully
      database:
        condition: service_healthy
  frontend:
    build: ../../frontend
    networks: [default, preview]
    volumes: [./storage-nginx.conf:/etc/nginx/conf.d/default.conf:ro]
    ports: [127.0.0.1:14218:80]
    depends_on: [backend]
volumes:
  database:
  keys:
  media:
networks:
  preview: {}
  default:
    internal: true
