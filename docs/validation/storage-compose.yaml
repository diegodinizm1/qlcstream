# Isolated fixture: no personal .env, media, service config or existing database.
name: qlcstream-storage-test
services:
  database:
    image: postgres:18.6-alpine@sha256:9ba53c7d41ea093baf5c1ba635ba5434c4f979880527d49bb7d9237d3193085b
    environment:
      POSTGRES_DB: storage_test
      POSTGRES_USER: storage_test
      POSTGRES_PASSWORD: storage_test_only
    volumes:
      - database:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, pg_isready -U storage_test -d storage_test]
      interval: 2s
      timeout: 2s
      retries: 30
  fixture:
    image: postgres:18.6-alpine@sha256:9ba53c7d41ea093baf5c1ba635ba5434c4f979880527d49bb7d9237d3193085b
    user: root
    entrypoint: /bin/sh
    command:
      - -c
      - |
        mkdir -p /media/incoming /media/next /config/qBittorrent/config
        chmod 777 /media /media/incoming /media/next
        printf '[Preferences]\nWebUI\\AuthSubnetWhitelistEnabled=true\nWebUI\\AuthSubnetWhitelist=172.31.166.0/24\nWebUI\\LocalHostAuth=false\nDownloads\\SavePath=/downloads/\n' > /config/qBittorrent/config/qBittorrent.conf
    volumes:
      - media:/media
      - engine:/config
  qbittorrent:
    image: qbittorrentofficial/qbittorrent-nox:5.3.0-2@sha256:43b2d352cf76330a7ca34c7320b9b74227d6f31e662e0e123d0457206b09a7ea
    environment:
      QBT_LEGAL_NOTICE: confirm
      QBT_WEBUI_PORT: 8080
    volumes:
      - media:/downloads
      - engine:/config
    depends_on:
      fixture:
        condition: service_completed_successfully
  backend:
    build:
      context: ../../backend
    image: qlcstream-storage-test-backend
    environment:
      DB_URL: jdbc:postgresql://database:5432/storage_test
      DB_USER: storage_test
      DB_PASSWORD: storage_test_only
      MEDIA_ROOT: /data
      QBITTORRENT_BASE_URL: http://qbittorrent:8080
      QBITTORRENT_USERNAME: isolated_test
      QBITTORRENT_PASSWORD: isolated_test
    volumes:
      - media:/data
    ports:
      - 127.0.0.1:18086:8080
    networks: [default, preview]
    depends_on:
      database:
        condition: service_healthy
      qbittorrent:
        condition: service_started
  frontend:
    build:
      context: ../../frontend
    image: qlcstream-storage-test-frontend
    volumes:
      - ./storage-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - 127.0.0.1:14216:80
    networks: [default, preview]
    depends_on:
      - backend
volumes:
  database:
  media:
  engine:
networks:
  preview: {}
  default:
    internal: true
    ipam:
      config:
        - subnet: 172.31.166.0/24
